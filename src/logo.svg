<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(178 360) rotate(-43) scale(390)">
      <stop stop-color="#5D7CFF"/>
      <stop offset="0.55" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#A83CFF"/>
    </radialGradient>

    <filter id="softGlow" x="70" y="70" width="372" height="372" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <filter id="symbolGlow" x="120" y="130" width="280" height="230" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- transparent background -->

  <circle cx="256" cy="256" r="192" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="192" fill="url(#bg)" filter="url(#softGlow)" opacity="0.55"/>

  <!-- blurred white glow -->
  <path d="M178 170L250 242L178 314" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#symbolGlow)" opacity="0.65"/>
  <path d="M258 307H333" stroke="white" stroke-width="22" stroke-linecap="round" filter="url(#symbolGlow)" opacity="0.65"/>

  <!-- main symbol -->
  <path d="M178 170L250 242L178 314" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M258 307H333" stroke="white" stroke-width="20" stroke-linecap="round"/>
</svg>